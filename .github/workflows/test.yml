# Typecheck and run the TypeScript and Python tests. app/data/ is git-ignored, so the tests that need
# the built map data or panoramas skip themselves here.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Imports of mars_streetview/tests and tests/ beyond the standard library.
      - run: python -m pip install numpy pillow
      # No app/.venv here, so scripts/py.mjs uses the setup-python interpreter.
      - run: npm run test:py
