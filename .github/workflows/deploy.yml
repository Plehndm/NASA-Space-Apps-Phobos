# Publishes the web build of the app, with its map data, to GitHub Pages:
#   https://<owner>.github.io/<repo>/
#
# app/data/ is git-ignored (built locally by the data pipeline), so this workflow takes it from a
# release asset instead: `npm run data:pack` (app/scripts/package-data.mjs) packs it into
# mapdata.tar.gz + mapdata.tar.gz.sha256, which are uploaded once to the release tagged MAP_DATA_TAG.
# The route assistant's live model needs a server, so the Pages build has none: the assistant
# answers from its offline scripted planner.
name: Deploy web demo

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  # Release holding mapdata.tar.gz and mapdata.tar.gz.sha256 (see app/README.md, "Web demo").
  MAP_DATA_TAG: map-data

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than cancelling one already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Pages serves a project site under /<repo>/; app.json's experiments.baseUrl must say the same,
      # or every script and asset 404s.
      - name: Check base path
        id: base
        run: |
          base="/${{ github.event.repository.name }}"
          got=$(node -p 'require("./app.json").expo.experiments?.baseUrl ?? ""')
          if [ "$got" != "$base" ]; then
            echo "::error file=app/app.json::expo.experiments.baseUrl is '$got' but this Pages site is served at '$base'"
            exit 1
          fi
          echo "path=$base" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Export web build
        run: npx expo export --platform web --output-dir dist
        env:
          # The map data is copied next to the app below, at <base>/mapdata/.
          EXPO_PUBLIC_DATA_URL: ${{ steps.base.outputs.path }}/mapdata
          # Deliberately not set: no assistant backend on Pages, so the scripted assistant answers.
          # EXPO_PUBLIC_ASSISTANT_URL:

      - name: Add map data
        run: node scripts/fetch-data.mjs --tag "$MAP_DATA_TAG" --repo "$GITHUB_REPOSITORY" --dest dist/mapdata
        env:
          GH_TOKEN: ${{ github.token }}

      # .nojekyll: Jekyll would drop the _expo/ folder. 404.html: any unknown path under the site
      # still loads the app (which has no routes of its own).
      - name: Finish site
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
          du -sh dist dist/mapdata

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
