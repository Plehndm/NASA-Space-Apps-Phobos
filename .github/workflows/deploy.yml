# Publishes the web build of the app, with its map data, to GitHub Pages:
#   https://<owner>.github.io/<repo>/
#
# app/data/ is git-ignored (built locally by the data pipeline), so this workflow takes it from a
# release asset instead: `npm run data:pack` (app/scripts/package-data.mjs) packs it into
# mapdata.tar.gz + mapdata.tar.gz.sha256, which are uploaded once to the release tagged MAP_DATA_TAG.
# The route assistant's live model needs a server holding the Claude API key, which Pages can't be.
# With the CLOUDFLARE_API_TOKEN and ANTHROPIC_API_KEY secrets set, this also deploys app/worker/ to
# Cloudflare Workers and builds the app against it; without them, the assistant answers from its
# offline scripted planner. Either way, if the key stops working the app falls back to that planner.
name: Deploy web demo

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "site/**"
      - "docs/screenshots/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  # Release holding mapdata.tar.gz and mapdata.tar.gz.sha256 (see app/README.md, "Web demo").
  MAP_DATA_TAG: map-data

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than cancelling one already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Pages serves a project site under /<repo>/; app.json's experiments.baseUrl must say the same,
      # or every script and asset 404s.
      - name: Check base path
        id: base
        run: |
          base="/${{ github.event.repository.name }}"
          got=$(node -p 'require("./app.json").expo.experiments?.baseUrl ?? ""')
          if [ "$got" != "$base" ]; then
            echo "::error file=app/app.json::expo.experiments.baseUrl is '$got' but this Pages site is served at '$base'"
            exit 1
          fi
          echo "path=$base" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Deploy assistant Worker
        id: assistant
        working-directory: app/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN or ANTHROPIC_API_KEY is not set, so the demo's assistant stays offline (scripted answers)"
            exit 0
          fi
          # Only needed when the token can see more than one Cloudflare account.
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          npx -y wrangler@4.151.3 deploy --var "ALLOWED_ORIGINS:https://${{ github.repository_owner }}.github.io" | tee "$RUNNER_TEMP/wrangler.log"
          printf '%s' "$ANTHROPIC_API_KEY" | npx -y wrangler@4.151.3 secret put ANTHROPIC_API_KEY
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/wrangler.log" | head -1)
          if [ -z "$url" ]; then
            echo "::error::No workers.dev address in the deploy output. Open Workers & Pages in the Cloudflare dashboard once to choose a workers.dev subdomain, then re-run."
            exit 1
          fi
          echo "url=$url/api/assistant" >> "$GITHUB_OUTPUT"

      - name: Export web build
        run: npx expo export --platform web --output-dir dist
        env:
          # The map data is copied next to the app below, at <base>/mapdata/.
          EXPO_PUBLIC_DATA_URL: ${{ steps.base.outputs.path }}/mapdata
          # The Worker deployed above; empty without it, and the scripted assistant answers.
          EXPO_PUBLIC_ASSISTANT_URL: ${{ steps.assistant.outputs.url }}

      - name: Add map data
        run: node scripts/fetch-data.mjs --tag "$MAP_DATA_TAG" --repo "$GITHUB_REPOSITORY" --dest dist/mapdata
        env:
          GH_TOKEN: ${{ github.token }}

      # .nojekyll: Jekyll would drop the _expo/ folder. 404.html: any unknown path under the site
      # still loads the app (which has no routes of its own).
      # The project showcase (site/) at <base>/showcase/, with the app screenshots it shows.
      - name: Add showcase page
        run: |
          mkdir -p dist/showcase/screens
          cp ../site/index.html dist/showcase/
          cp ../docs/screenshots/*.jpg dist/showcase/screens/

      - name: Finish site
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
          du -sh dist dist/mapdata

      # Pages lets browsers cache pages for 10 minutes; this makes open links switch to a new deploy at once.
      - name: Stamp build
        run: node scripts/stamp-build.mjs dist "${{ steps.base.outputs.path }}" "${{ github.sha }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
